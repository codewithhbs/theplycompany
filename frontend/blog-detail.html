<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Blog | Pradeep Timber Enterprises</title>
<meta name="description" content="Buying guides, material comparisons and interior tips from Pradeep Timber Enterprises." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { brown:"#6B4226", beige:"#D4A373", green:"#3A5A40", ivory:"#F8F6F2", ink:"#222222" }, fontFamily: { display:["Poppins","sans-serif"], sans:["Inter","sans-serif"] } } } };
</script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="blog" class="bg-ivory-grain antialiased">

<script>const BASE_PATH = "";</script>
<div id="site-header-mount"></div>

<section class="relative pt-40 pb-16 overflow-hidden">
  <div class="ring-bg-decor text-beige w-[420px] h-[420px] -top-32 -right-32 hidden md:block"></div>
  <div class="mx-auto max-w-3xl px-5 lg:px-8 relative">
    <nav class="text-sm text-stone-500 flex items-center gap-2" aria-label="Breadcrumb">
      <a href="index.html" class="hover:text-brown">Home</a><span>/</span><a href="blog.html" class="hover:text-brown">Blog</a><span>/</span><span class="text-brown font-medium">Article</span>
    </nav>
    <div id="blog-detail-content">
      <p class="mt-10 text-stone-500">Loading...</p>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>
<button id="back-to-top" class="back-to-top" aria-label="Back to top"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const el = document.getElementById("blog-detail-content");
    if (!slug) { el.innerHTML = '<p class="mt-10 text-stone-500">No article specified. <a href="blog.html" class="text-brown font-semibold">Back to blog</a></p>'; return; }
    try {
      const res = await fetch("https://www.api.theplycompany.com/api/blogs/slug/" + encodeURIComponent(slug));
      if (!res.ok) throw new Error("Not found");
      const b = await res.json();
      document.getElementById("page-title").textContent = (b.metaTitle || b.title) + " | Pradeep Timber Enterprises";
      const setMeta = (sel, attr, val) => {
        if (!val) return;
        let el = document.querySelector(sel);
        if (!el) {
          el = document.createElement(sel.startsWith("link") ? "link" : "meta");
          if (sel.includes("property")) el.setAttribute("property", sel.match(/"([^"]+)"/)[1]);
          else if (sel.includes('rel="canonical"')) el.setAttribute("rel", "canonical");
          else el.setAttribute("name", sel.match(/"([^"]+)"/)[1]);
          document.head.appendChild(el);
        }
        el.setAttribute(attr, val);
      };
      const metaDesc = b.metaDescription || b.excerpt;
      setMeta('meta[name="description"]', "content", metaDesc);
      setMeta('meta[name="keywords"]', "content", b.metaKeywords);
      setMeta('meta[property="og:title"]', "content", b.metaTitle || b.title);
      setMeta('meta[property="og:description"]', "content", metaDesc);
      setMeta('meta[property="og:image"]', "content", b.image);
      setMeta('meta[property="og:type"]', "content", "article");
      setMeta('meta[name="twitter:card"]', "content", "summary_large_image");
      setMeta('meta[name="twitter:title"]', "content", b.metaTitle || b.title);
      setMeta('meta[name="twitter:description"]', "content", metaDesc);
      setMeta('link[rel="canonical"]', "href", window.location.origin + "/blog-detail.html?slug=" + b.slug);
      el.innerHTML = `
        <span class="eyebrow mt-6 inline-flex">${b.category}</span>
        <h1 class="font-display font-bold text-3xl sm:text-4xl mt-4 text-[#241811]">${b.title}</h1>
        <div class="flex items-center gap-3 text-xs text-stone-500 mt-4"><span>${new Date(b.date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}</span><span>&middot;</span><span>${b.readTime}</span></div>
        <img src="https://www.api.theplycompany.com${b.image}" alt="${b.title}" class="w-full h-72 sm:h-96 object-cover rounded-2xl mt-8" />
        <div class="prose-content mt-8 text-stone-700 leading-relaxed">${b.content}</div>
        <a href="blog.html" class="inline-flex items-center gap-2 mt-10 font-semibold text-brown">&larr; Back to all articles</a>
      `;
    } catch (e) {
      el.innerHTML = '<p class="mt-10 text-stone-500">Article not found. <a href="blog.html" class="text-brown font-semibold">Back to blog</a></p>';
    }
  })();
</script>
</body>
</html>
